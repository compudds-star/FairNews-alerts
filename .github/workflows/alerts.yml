name: Breaking news alerts

# Started every 10 minutes through the GitHub API by a cron job on the Oracle
# hub (~/fairnews-dispatch.sh). GitHub's own schedule ran only 3-4 times a day.
on:
  workflow_dispatch:
    inputs:
      test_push:
        description: "Send one test alert instead of checking the news"
        type: boolean
        default: false
      dry_run:
        description: "Detect breaking news without sending or saving anything"
        type: boolean
        default: false

# Never run two checks at once; they share the alerted-stories state. Dry runs
# touch no state, so they queue separately and can't bump a real check.
concurrency:
  group: ${{ inputs.dry_run && 'alerts-dry' || 'alerts' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    # Linux: GitHub's largest runner pool. macOS runners ran short on
    # 2026-10-28 and checks failed or waited in the queue.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Check out FairNews (private, read-only deploy key)
        uses: actions/checkout@v4
        with:
          repository: compudds-star/FairNews
          ssh-key: ${{ secrets.FAIRNEWS_DEPLOY_KEY }}
          path: app

      # Phones the app registered itself (one <token>.json file each). If this
      # fails, alerts still go to the phones in the DEVICE_TOKEN(S) secrets.
      - name: Check out registered devices (private, read-only deploy key)
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: compudds-star/FairNews-devices
          ssh-key: ${{ secrets.DEVICES_DEPLOY_KEY }}
          path: devices

      - name: Restore compiled job
        id: bin
        uses: actions/cache@v4
        with:
          path: alertjob
          key: alertjob-${{ runner.os }}-${{ hashFiles('app/FairNews/Core/**', 'app/AlertJob/**', 'Package.swift', 'Package.resolved') }}

      # Swift comes preinstalled on GitHub's Ubuntu runners. The package builds
      # the job from app/ and adds swift-crypto (CryptoKit's API) for Linux.
      - name: Build
        if: steps.bin.outputs.cache-hit != 'true'
        run: |
          swift --version
          swift build -c release
          cp .build/release/alertjob alertjob

      - name: Restore alerted-stories state
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: state-${{ github.run_id }}
          restore-keys: state-

      - name: Check for breaking news
        env:
          DEVICE_TOKEN: ${{ secrets.DEVICE_TOKEN }}
          DEVICE_TOKENS: ${{ secrets.DEVICE_TOKENS }}
          DEVICES_DIR: devices/devices
          APNS_KEY: ${{ secrets.APNS_KEY }}
          APNS_KEY_ID: ${{ secrets.APNS_KEY_ID }}
          APNS_TEAM_ID: ${{ vars.APNS_TEAM_ID }}
          APNS_SANDBOX: ${{ vars.APNS_SANDBOX }}
          MIN_OUTLETS: ${{ vars.MIN_OUTLETS }}
          TOPICS: ${{ vars.TOPICS }}
          DRY_RUN: ${{ inputs.dry_run && '1' || vars.DRY_RUN }}
          TEST_PUSH: ${{ inputs.test_push && '1' || '' }}
          STATE_FILE: state.json
        run: ./alertjob

      - name: Save alerted-stories state
        if: always() && !inputs.dry_run && hashFiles('state.json') != ''
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: state-${{ github.run_id }}

